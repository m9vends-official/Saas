# ─────────────────────────────────────────────────────────────────────────────
#  Mosquitto MQTT Broker Config — M9Vends Phase 3
# ─────────────────────────────────────────────────────────────────────────────

# ── Persistence ─────────────────────────────────────────────────────────────
# Retain messages on disk so they survive broker restarts
persistence true
persistence_location /mosquitto/data/

# ── Logging ─────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# ── Listener 1: MQTT TCP (Node.js & CLI tools) ──────────────────────────────
listener 1883
allow_anonymous true

# ── Listener 2: WebSocket (MQTT Explorer browser connections) ───────────────
listener 9001
protocol websockets
allow_anonymous true
